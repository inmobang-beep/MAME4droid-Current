apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    compileSdk = 37

    //ndkVersion = "21.3.6528147"

	ndkVersion = "28.2.13676358"

	buildFeatures {
		buildConfig = true
	}

	compileOptions {
		sourceCompatibility = JavaVersion.VERSION_17
		targetCompatibility = JavaVersion.VERSION_17
	}
	kotlinOptions { jvmTarget = "17" }

    defaultConfig {
        // Beetle Game Room: own package, installs next to the official MAME4droid
        applicationId "com.beetle.gameroom"
        minSdkVersion 29
        // -PlegacyStorage: target 29 so the shared ROMs folder needs only the ordinary storage
        // permission popup (head units without the all-files access settings screen)
        targetSdkVersion project.hasProperty('legacyStorage') ? 29 : 37
        versionCode 145
        versionName '1.41.2'

        ndk {
            moduleName = "mame4droid-jni"
            //noinspection ChromeOsAbiSupport
            abiFilters   "arm64-v8a"
			//ndkPath "C:\\Android\\android-ndk-r27c"
			ndkVersion = "28.2.13676358"
        }
    }

	base {
		archivesName = "MAME4droid 2026-" + defaultConfig.versionName
	}

    bundle {
        language {
            // This property is set to true by default.
            enableSplit = false
        }
        density {
            // This property is set to true by default.
            enableSplit = false
        }
        abi {
            // This property is set to true by default.
            enableSplit = false
        }
    }

    packagingOptions {
		//doNotStrip "**/*.so" //CUIDADO QUITAR EN RELEASE. Lo he añadido al final con nueva sintaxis
        jniLibs {
            useLegacyPackaging = true
        }
    }

    buildTypes {
        release {
			//minifyEnabled true
			minifyEnabled false
			//shrinkResources true

            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.txt'
			signingConfig = signingConfigs.debug
		}
		debug {
			minifyEnabled false
			debuggable true
			jniDebuggable true
			//renderscriptDebuggable true
		}
    }

    // -PprebuiltLibs: package the .so files already in src/main/jniLibs instead of running ndk-build
    if (!project.hasProperty('prebuiltLibs')) {
        externalNativeBuild {
            ndkBuild {
                path file('src/main/jni/Android.mk')
            }
        }
    }

    namespace = 'com.seleuco.mame4droid'

}

dependencies {
	//implementation "androidx.annotation:annotation:1.7.0"
}

androidComponents {
	onVariants(selector().withBuildType("debug")) {
		packaging.jniLibs.keepDebugSymbols.add("**/*.so")
	}

	registerSourceType("../../../../src") // will cause src/main/foobar (and src/debug/foobar etc.) to appear as sources in Android Studi
}
